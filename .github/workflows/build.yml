name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Noble (24.04) uses deb822 sources
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
              echo "Types: deb
URIs: http://ports.ubuntu.com/ubuntu-ports/
Suites: noble noble-updates noble-backports noble-security
Components: main restricted universe multiverse
Architectures: arm64" | sudo tee /etc/apt/sources.list.d/arm64.sources
            else
              sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
            fi
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y libasound2-dev:arm64 gcc-aarch64-linux-gnu
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.os == 'linux' && '1' || '0' }}
          CC: ${{ (matrix.os == 'linux' && matrix.arch == 'arm64') && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          BINARY_NAME="modulation"
          if [ "${{ matrix.os }}" = "windows" ]; then BINARY_NAME="modulation.exe"; fi
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          go build -ldflags "-X main.version=$VERSION" -o "dist/$BINARY_NAME-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}" .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modulation-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: modulation-*
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
